# =============================================================
# TEST CONFIGURATION - H2 In-Memory Database
# This file overrides application.properties during tests.
# Tests NEVER touch the real MySQL database.
# =============================================================

spring.application.name=gestionAlumni-test
spring.profiles.active=test

# --- H2 In-Memory Database ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Disable Mail (no SMTP connection during tests) ---
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Server ---
server.port=0

# --- File uploads ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Logging (reduce noise) ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.test=INFO
logging.level.com.example.gestionAlumni=DEBUG
